<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Gods' Tournament · Crocevia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--bg:#0D0C10;--panel:rgba(22,20,28,.82);--line:rgba(214,166,69,.28);--gold:#D6A645;--cream:#F3ECDF;--muted:#A89F92;--soft:rgba(243,236,223,.06)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
#app{height:100%}
html,body{margin:0;height:100%;background:var(--bg);color:var(--cream);font-family:Inter,system-ui,sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none}
h1,h2,h3,.cz{font-family:Cinzel,Georgia,serif;letter-spacing:.04em;font-weight:700;margin:0}
p{margin:0}
button{font:inherit;cursor:pointer;color:inherit}
input{font:inherit}
.btn{background:linear-gradient(180deg,#E8C26A,#B98A2E);color:#1D1A22;border:0;border-radius:12px;padding:14px 18px;font-weight:600;font-size:16px;box-shadow:0 4px 18px rgba(214,166,69,.22);width:100%}
.btn:disabled{opacity:.35;box-shadow:none}
.btn.ghost{background:transparent;color:var(--cream);border:1px solid var(--line);box-shadow:none}
.btn.small{padding:9px 12px;font-size:14px;width:auto}
.pulse{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(214,166,69,.55)}50%{box-shadow:0 0 0 10px rgba(214,166,69,0)}}
.glass{background:var(--panel);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:16px}
.muted{color:var(--muted)}
.gold{color:var(--gold)}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;flex:none}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:var(--soft);border:1px solid var(--line);font-size:13px;white-space:nowrap}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 14px);transform:translateX(-50%);z-index:60;max-width:92vw;padding:12px 16px;font-size:15px;text-align:center;animation:tin .25s ease-out}
@keyframes tin{from{opacity:0;transform:translate(-50%,-8px)}to{opacity:1;transform:translate(-50%,0)}}
/* svg map */
.map-svg{width:100%;height:100%;display:block;touch-action:none}
.lbl{font-family:Cinzel,Georgia,serif;font-weight:700;fill:#F3ECDF;paint-order:stroke;stroke:#0D0C10;stroke-width:6px;stroke-linejoin:round;letter-spacing:.06em}
.lbl.sm{font-size:17px}
.pname{font-family:Inter,sans-serif;font-weight:600;font-size:15px;fill:#F3ECDF;paint-order:stroke;stroke:#0D0C10;stroke-width:5px}
.flick{animation:flick 1.1s ease-in-out infinite alternate}
.flick.b{animation-duration:.8s;animation-delay:.3s}
@keyframes flick{from{opacity:.45}to{opacity:1}}
.smoke{transform-box:fill-box;transform-origin:center;animation:smoke 7s linear infinite;opacity:0}
@keyframes smoke{0%{transform:translate(0,0) scale(.5);opacity:0}15%{opacity:.55}100%{transform:translate(40px,-190px) scale(1.8);opacity:0}}
.wpulse{animation:wp 3.5s ease-in-out infinite}
@keyframes wp{0%,100%{opacity:.55}50%{opacity:1}}
.mering{transform-box:fill-box;transform-origin:center;animation:mer 1.6s ease-out infinite}
@keyframes mer{from{transform:scale(.8);opacity:.9}to{transform:scale(1.7);opacity:0}}
.closed-tag{display:none}
.st-allarme .closed-tag{display:inline}
.bibin .ct-locanda{display:none!important}
.topics{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.topics button{border:1px solid var(--line);background:rgba(243,236,223,.04);border-radius:12px;padding:10px 12px;font-size:14px;text-align:left}
.topics button.seen{opacity:.5}
.say p+p{margin-top:10px}
.story .rew{margin-top:6px;padding:14px 18px;border-radius:14px;border:1px solid var(--line);background:rgba(214,166,69,.08);font-size:19px;line-height:1.5}
.st-allarme .shop-lit{opacity:.25}
#fire{display:none}
.st-allarme #fire,.st-lobby #fire,.st-prologo #fire,.st-dungeon #fire{display:inline}
.arena-on{display:none}
.st-libera .arena-on,.st-premio .arena-on{display:inline}
.st-libera .arena-off,.st-premio .arena-off{display:none}
/* tablet */
#tab{display:flex;height:100%;position:relative}
#tab .mapwrap{flex:1;position:relative;min-width:0;background:radial-gradient(ellipse at center,#16141b,#0b0a0e)}
#tab .side{width:360px;padding:18px;display:flex;flex-direction:column;gap:14px;overflow:auto;border-left:1px solid var(--line);background:linear-gradient(180deg,#15131b,#0e0d12)}
.sec{padding:14px}
.sec h3{font-size:14px;color:var(--gold);margin-bottom:10px;letter-spacing:.12em}
.row{display:flex;align-items:center;gap:10px}
.prow{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid rgba(243,236,223,.06)}
.prow:last-child{border-bottom:0}
.mrow{padding:8px 0;border-bottom:1px solid rgba(243,236,223,.06);font-size:14px}
.mrow:last-child{border-bottom:0}
.overlay{position:absolute;inset:0;background:rgba(8,7,10,.86);display:flex;align-items:center;justify-content:center;z-index:30;padding:30px}
.story{max-width:880px;width:100%;padding:40px 50px;text-align:left;max-height:100%;overflow:auto}
.story .kick{font-size:14px;letter-spacing:.2em;color:var(--gold);font-family:Cinzel,serif;margin-bottom:18px}
.story p{font-size:clamp(18px,2vw,24px);line-height:1.5;margin-bottom:16px}
.story p.q{font-style:italic}
.story .who{font-family:Cinzel,serif;color:var(--gold);font-size:20px;margin-bottom:8px}
.story .acts{display:flex;gap:12px;justify-content:flex-end;position:sticky;bottom:-40px;margin:20px -50px -40px;padding:16px 50px 26px;background:linear-gradient(180deg,rgba(20,18,26,0),rgba(20,18,26,.97) 35%)}
.story .acts .btn{width:auto;min-width:220px}
.lobby{display:flex;gap:40px;align-items:center;max-width:1050px;width:100%;padding:44px}
.qrbox{background:#F3ECDF;padding:16px;border-radius:14px;width:260px;height:260px;display:flex;align-items:center;justify-content:center;flex:none}
.qrbox img,.qrbox canvas{width:228px!important;height:228px!important}
.code{font-family:Cinzel,serif;font-size:54px;letter-spacing:.2em;color:var(--gold)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 24px}
#bibwrap{position:absolute;inset:0;z-index:40;background:#0d0c10}
#bibwrap iframe,#pbib iframe{width:100%;height:100%;border:0;display:block}
#pbib{position:fixed;inset:0;z-index:70;background:#0d0c10}
/* prova dimostrativa */
#demo{display:flex;height:100%}
#demo #tab .side{width:300px}
.dbar{display:none}
@media(max-width:760px){
 #tab{flex-direction:column}
 #tab .mapwrap{flex:none;height:52%}
 #tab .side,#demo #tab .side{width:auto;border-left:0;border-top:1px solid var(--line)}
 .lobby{flex-direction:column;padding:24px;gap:18px}
 .story{padding:26px}
 .story p{font-size:19px}
 .story .acts .btn{min-width:0;flex:1}
}
#troot{flex:1;min-width:0;height:100%}
.pcol{width:410px;flex:none;display:flex;flex-direction:column;align-items:center;padding:12px 10px;gap:10px;background:#09080b;border-left:1px solid var(--line)}
.psw{display:flex;gap:6px}
.psw button{border:1px solid var(--line);background:none;border-radius:999px;padding:8px 14px;font-size:13px;color:var(--muted);font-weight:600}
.psw button.on{background:rgba(214,166,69,.16);color:var(--gold)}
.pframe{flex:1;width:390px;max-height:844px;border-radius:28px;border:6px solid #26222c;overflow:hidden;background:#000}
.pframe iframe{width:100%;height:100%;border:0;display:block}
@media(max-width:1000px){
 #demo{flex-direction:column}
 .dbar{display:flex;gap:6px;padding:8px;justify-content:center;border-bottom:1px solid var(--line);background:#09080b}
 .dbar button{border:1px solid var(--line);background:none;border-radius:999px;padding:8px 14px;font-size:13px;color:var(--muted);font-weight:600}
 .dbar button.on{background:rgba(214,166,69,.16);color:var(--gold)}
 #troot,.pcol{flex:1;min-height:0}
 #demo[data-view=tavolo] .pcol{display:none}
 #demo:not([data-view=tavolo]) #troot{display:none}
 .pcol{width:100%;border-left:0}
 .psw{display:none}
 .pframe{width:min(390px,100%)}
}
/* phone */
#ph{display:flex;flex-direction:column;height:100%}
#ph header{padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);background:#121016}
#ph header .nm{font-family:Cinzel,serif;font-weight:700;font-size:17px}
#ph header .sub{font-size:12px;color:var(--muted)}
#ph main{flex:1;position:relative;overflow:hidden}
#ph nav{display:flex;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);background:#121016}
#ph nav button{flex:1;background:none;border:0;color:var(--muted);padding:12px 0 14px;font-size:13px;font-weight:600;letter-spacing:.04em}
#ph nav button.on{color:var(--gold)}
.pane{position:absolute;inset:0;overflow:auto;padding:16px 16px 30px}
.sheet{position:absolute;inset:0;background:linear-gradient(180deg,#1c1924,#0f0e13);z-index:8;display:flex;flex-direction:column;overflow:auto;padding:18px 18px calc(env(safe-area-inset-bottom) + 18px);animation:sin .22s ease-out}
@keyframes sin{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.npc{display:flex;align-items:center;gap:14px;margin-bottom:16px}
.npc .av{width:58px;height:58px;border-radius:50%;border:2px solid var(--gold);display:flex;align-items:center;justify-content:center;font-family:Cinzel,serif;font-size:24px;font-weight:700;background:radial-gradient(circle at 35% 30%,#3b3446,#16141b);flex:none}
.npc .nm{font-family:Cinzel,serif;font-size:19px;font-weight:700}
.say{font-size:16px;line-height:1.5;padding:14px;border-radius:14px;background:var(--soft);border:1px solid rgba(243,236,223,.08);margin-bottom:14px}
.opt{display:flex;flex-direction:column;gap:10px;margin-bottom:14px}
.opt .card-opt{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px;border-radius:14px;border:1px solid var(--line);background:rgba(214,166,69,.06);text-align:left;width:100%}
.opt .card-opt:disabled{opacity:.4}
.opt .card-opt .t{font-weight:600}
.opt .card-opt .d{font-size:13px;color:var(--muted);margin-top:3px}
.price{font-family:Cinzel,serif;color:var(--gold);font-weight:700;white-space:nowrap}
.fab{position:absolute;right:14px;bottom:14px;z-index:4;width:auto;padding:10px 14px;font-size:14px}
.banner{position:absolute;left:12px;right:12px;top:12px;z-index:6;padding:12px 14px;display:flex;align-items:center;gap:10px}
.banner .t{flex:1;font-size:15px}
.tabs{display:flex;gap:6px;margin:10px 0 14px;overflow-x:auto}
.tabs button{border:1px solid var(--line);background:none;border-radius:999px;padding:7px 12px;font-size:13px;white-space:nowrap;color:var(--muted)}
.tabs button.on{background:rgba(214,166,69,.16);color:var(--gold)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tcard{aspect-ratio:63/88;border-radius:10px;padding:8px;display:flex;flex-direction:column;justify-content:space-between;border:2px solid;background:linear-gradient(160deg,#2a2532,#121016);text-align:left;position:relative;overflow:hidden}
.tcard .cat{font-size:9px;letter-spacing:.14em;color:var(--muted);font-weight:600}
.tcard .nm{font-family:Cinzel,serif;font-size:12px;font-weight:700;line-height:1.2}
.tcard .ep{font-size:10px;color:var(--muted)}
.tcard .ico{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;opacity:.22}
.tcard .tag{position:absolute;top:6px;right:6px;font-size:9px;font-weight:700;padding:2px 6px;border-radius:6px;background:var(--gold);color:#1D1A22}
.tcard.miss{border:1.5px dashed rgba(243,236,223,.18);background:rgba(243,236,223,.02)}
.tcard.miss .ico{opacity:.12}
.addbox{display:flex;gap:8px}
.addbox input{flex:1;min-width:0;background:#0b0a0e;border:1px solid var(--line);border-radius:12px;padding:12px;color:var(--cream);font-size:20px;letter-spacing:.2em;text-align:center}
select{width:100%;background:#0b0a0e;border:1px solid var(--line);border-radius:12px;padding:12px;color:var(--cream);font-size:15px}
.bar{height:6px;border-radius:6px;background:rgba(243,236,223,.08);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#B98A2E,#E8C26A)}
.full{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:28px;gap:14px}
.full p{font-size:17px;line-height:1.5}
.slot{display:flex;align-items:center;gap:12px;padding:10px;border-radius:12px;border:1px solid var(--line);margin-bottom:8px;background:var(--soft)}
.slot .k{font-size:11px;letter-spacing:.12em;color:var(--muted);width:86px;flex:none}
.slot .v{font-weight:600}
</style>
</head>

/* ============ PEDINE (animazione) ============ */
let S = null;          // stato (sul tablet: verità; sul telefono: copia)
let MYPID = null;
const ANIM = {};
function heroOf(p) { return p && p.hero ? CARDS[p.hero] : null; }
function inGame() { return S ? Object.values(S.players).filter(p => p.hero) : []; }
function standPos(p) {
  const base = N[p.node] || N.Ps;
  const same = inGame().filter(q => q.node === p.node && !q.move).sort((a, b) => a.joined - b.joined);
  const i = same.findIndex(q => q.pid === p.pid), n = same.length;
  return [base[0] + (i - (n - 1) / 2) * 48, base[1]];
}
function syncAnims() {
  if (!S) return;
  const now = performance.now();
  inGame().forEach(p => {
    if (p.move && (!ANIM[p.pid] || ANIM[p.pid].seq !== p.move.seq)) {
      const pts = p.move.path.map(n => N[n]);
      ANIM[p.pid] = {seq:p.move.seq, pts, t0:now, dur:pathLen(p.move.path) / SPEED * 1000};
    }
    if (!p.move && ANIM[p.pid]) delete ANIM[p.pid];
  });
}
function posOf(p, now) {
  const a = ANIM[p.pid];
  if (!a) return standPos(p);
  let t = Math.min(1, (now - a.t0) / a.dur), total = 0, segs = [];
  for (let i = 1; i < a.pts.length; i++) { const d = dist(a.pts[i - 1], a.pts[i]); segs.push(d); total += d; }
  let go = t * total;
  for (let i = 0; i < segs.length; i++) { if (go <= segs[i] || i === segs.length - 1) { const k = segs[i] ? Math.min(1, go / segs[i]) : 1; const A = a.pts[i], B = a.pts[i + 1]; return [A[0] + (B[0] - A[0]) * k, A[1] + (B[1] - A[1]) * k]; } go -= segs[i]; }
  return a.pts[a.pts.length - 1];
}
function drawPawns() {
  document.querySelectorAll('.map-svg .pawns').forEach(g => {
    const want = inGame().map(p => p.pid).join(',');
    if (g.dataset.k !== want + '|' + inGame().map(p => p.color + p.hero).join(',')) {
      g.dataset.k = want + '|' + inGame().map(p => p.color + p.hero).join(',');
      g.innerHTML = inGame().map(p => {
        const h = heroOf(p), me = p.pid === MYPID;
        return `<g data-pid="${p.pid}">${me ? `<circle r="24" fill="none" stroke="${p.color}" stroke-width="4" class="mering"/>` : ''}<ellipse cx="3" cy="20" rx="21" ry="7" fill="#000" opacity=".5"/><circle r="23" fill="#16141b" stroke="${p.color}" stroke-width="5"/><circle r="17" fill="${p.color}" opacity=".28"/><text y="7" text-anchor="middle" font-family="Cinzel" font-weight="700" font-size="17" fill="#F3ECDF">${esc(h.name.slice(0, 2).toUpperCase())}</text><text y="46" text-anchor="middle" class="pname">${esc(h.name)}</text></g>`;
      }).join('');
    }
  });
}
function tick() {
  const now = performance.now();
  if (S) {
    drawPawns();
    inGame().forEach(p => {
      const [x, y] = posOf(p, now);
      document.querySelectorAll(`.map-svg .pawns [data-pid="${p.pid}"]`).forEach(el => el.setAttribute('transform', `translate(${x.toFixed(1)} ${y.toFixed(1)})`));
    });
  }
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

  host(code, onMsg, onStatus) {

    if (DEMO) {
      const wins = {};
      window.addEventListener('message', e => { const m = e.data; if (!m || !m.gt || !m.from) return; wins[m.from] = e.source; onMsg(m.from, m.data); });
      this.sendTo = (pid, data) => { if (wins[pid]) wins[pid].postMessage({gt:1, data}, '*'); };
      this.all = data => Object.values(wins).forEach(w => w.postMessage({gt:1, data}, '*'));
      onStatus('prova in questa pagina');
      return;
    }
    if (LOCAL) {
      const bc = new BroadcastChannel('gtcroc-' + code);
      bc.onmessage = e => { const m = e.data; if (m.to === 'host') onMsg(m.from, m.data); };
      this.sendTo = (pid, data) => bc.postMessage({to:pid, data});
      this.all = data => bc.postMessage({to:'*', data});
      onStatus('locale');
      return;
    }
    if (typeof Peer === 'undefined') { onStatus('errore: libreria di collegamento non caricata'); this.sendTo = () => {}; this.all = () => {}; return; }
    const peer = new Peer('gtcroc-' + code);
    peer.on('open', () => onStatus('attivo'));
    peer.on('error', e => { onStatus('errore: ' + e.type); if (e.type === 'unavailable-id') hostNewCode(); });
    peer.on('disconnected', () => { onStatus('riconnessione…'); setTimeout(() => { try { peer.reconnect(); } catch (e) {} }, 1500); });
    peer.on('connection', conn => {
      conn.on('data', d => { if (d && d.pid) { this.conns[d.pid] = conn; } onMsg(d.pid, d.data); });
      conn.on('close', () => { Object.keys(this.conns).forEach(k => { if (this.conns[k] === conn) { delete this.conns[k]; setOnline(k, false); } }); });
    });
    this.sendTo = (pid, data) => { const c = this.conns[pid]; if (c && c.open) c.send({data}); };
    this.all = data => Object.values(this.conns).forEach(c => { if (c.open) c.send({data}); });
  },
  client(code, pid, onMsg, onStatus) {
    if (IFR) {
      window.addEventListener('message', e => { if (e.data && e.data.gt && !e.data.from) onMsg(e.data.data); });
      this.send = data => parent.postMessage({gt:1, from:pid, data}, '*');
      onStatus('ok');
      this.send({t:'hello'});
      setInterval(() => { if (!S) this.send({t:'hello'}); }, 1000);
      return;
    }
    if (LOCAL) {
      const bc = new BroadcastChannel('gtcroc-' + code);
      bc.onmessage = e => { const m = e.data; if (m.to === pid || m.to === '*') onMsg(m.data); };
      this.send = data => bc.postMessage({to:'host', from:pid, data});
      onStatus('ok');
      this.send({t:'hello'});
      setInterval(() => { if (!S) this.send({t:'hello'}); }, 1500);
      return;
    }
    if (typeof Peer === 'undefined') { onStatus('Non riesco a caricare il collegamento. Controlla la rete.'); this.send = () => {}; return; }
    let peer = null, conn = null, pending = 0;
    const connect = () => {
      if (conn && conn.open) return;
      if (Date.now() - pending < 6000) return;
      pending = Date.now();
      onStatus('Collegamento al tavolo…');
      if (!peer || peer.destroyed) { peer = new Peer(); peer.on('error', () => { pending = 0; onStatus('Il tavolo non risponde. Riprovo…'); }); }
      else if (peer.disconnected) { try { peer.reconnect(); } catch (e) {} }
      const go = () => {
        conn = peer.connect('gtcroc-' + code, {reliable:true});
        conn.on('open', () => { pending = 0; onStatus('ok'); conn.send({pid, data:{t:'hello'}}); });
        conn.on('data', d => onMsg(d.data));
        conn.on('close', () => { pending = 0; onStatus('Collegamento perso. Riprovo…'); setTimeout(connect, 2000); });
      };
      if (peer.open) go(); else peer.once('open', go);
    };
    this.send = data => { if (conn && conn.open) conn.send({pid, data}); };
    connect();
    setInterval(() => { if (!conn || !conn.open) connect(); }, 4000);
    document.addEventListener('visibilitychange', () => { if (!document.hidden) connect(); });
  },
};

function newCode() { const L = 'ABCDEFGHJKLMNPQRSTUVWXYZ'; let c = ''; for (let i = 0; i < 4; i++) c += L[Math.floor(Math.random() * L.length)]; return c; }
function freshState(code) { return {code, phase:'lobby', step:0, players:{}, diario:[], unlocked:[], arena:false, voce:0, log:[], seq:0}; }

function hostHandle(pid, m) {
  if (!pid || !m) return;
  let p = S.players[pid];
  if (m.t === 'hello') {
    if (!p) {
      const used = Object.values(S.players).map(q => q.color);
      p = S.players[pid] = {pid, color:COLORS.find(c => !used.includes(c)) || COLORS[Object.keys(S.players).length % 6], coll:[], hero:null, equip:{}, corone:20, hp:0, lessons:[], node:'Ps', inside:null, move:null, mseq:0, joined:Date.now(), online:true};
    }
    p.online = true;
    if (p.move) { p.move = null; } // un cammino interrotto riparte da fermo
    commit(); NET.sendTo(pid, {t:'state', s:S});
    return;
  }
  if (!p) return;
  const H = heroOf(p);
  switch (m.t) {
    case 'add': {
      const code = String(m.code || '').replace(/\D/g, '');
      const c = CARDS[code];
      if (!c) return toastTo(pid, 'Codice non trovato. Controlla le 6 cifre sul retro della carta.');
      const o = owner(code);
      if (o) return toastTo(pid, o.pid === pid ? 'Questa carta è già nella tua collezione.' : 'Questa carta è già nella collezione di ' + (heroOf(o) ? heroOf(o).name : 'un altro giocatore') + '.');
      p.coll.push(code);
      let msg = c.name + ' entra nella tua collezione.';
      if (c.cat === 'personaggio' && !p.hero) { p.hero = code; p.hp = hpMax(p); msg = c.name + ' è il tuo eroe per la campagna.'; }
      else if (c.cat !== 'personaggio' && !p.equip[c.cat]) { p.equip[c.cat] = code; msg = c.name + ' entra nella collezione ed è equipaggiata.'; }
      commit(); toastTo(pid, msg); return;
    }
    case 'remove': {
      const code = m.code; if (!p.coll.includes(code)) return;
      if (p.hero === code && S.phase !== 'lobby') return toastTo(pid, 'È il tuo eroe in campagna: non si toglie.');
      p.coll = p.coll.filter(x => x !== code);
      if (p.hero === code) { p.hero = null; p.hp = 0; }
      Object.keys(p.equip).forEach(k => { if (p.equip[k] === code) delete p.equip[k]; });
      commit(); return;
    }
    case 'hero': {
      if (!p.coll.includes(m.code) || CARDS[m.code].cat !== 'personaggio') return;
      if (S.phase !== 'lobby' && p.hero) return toastTo(pid, 'In campagna si porta un solo eroe: ' + H.name + '.');
      p.hero = m.code; p.lessons = []; p.hp = hpMax(p); commit(); return;
    }
    case 'equip': {
      const c = CARDS[m.code]; if (!c || !p.coll.includes(m.code) || c.cat === 'personaggio') return;
      if (S.phase === 'dungeon') return toastTo(pid, 'Nei dungeon l’equipaggiamento non si cambia.');
      if (p.equip[c.cat] === m.code) delete p.equip[c.cat]; else p.equip[c.cat] = m.code;
      commit(); return;
    }
    case 'goto': return hostGoto(p, m.place);
    case 'leave': {
      if (!p.inside) return;
      p.inside = null; commit(); return;
    }
    case 'accept': {
      const mi = MISSIONI.find(x => x.id === m.id); if (!mi || p.inside !== 'bacheca') return;
      if (mi.hidden && !S.unlocked.includes(mi.id)) return;
      if (S.diario.some(d => d.id === mi.id)) return toastTo(pid, 'È già nel Diario del gruppo.');
      S.diario.push({id:mi.id, by:pid, stato:'in corso'}); logIt(H.name + ' ha preso la missione «' + mi.name + '»');
      commit(); toastTo(pid, 'Missione aggiunta al Diario del gruppo.'); return;
    }
    case 'buy': {
      if (p.inside !== 'bustine') return;
      if (p.corone < 80) return toastTo(pid, 'Servono 80 corone. Ne hai ' + p.corone + '.');
      p.corone -= 80; logIt(H.name + ' ha comprato una bustina');
      commit(); NET.sendTo(pid, {t:'bought'}); return;
    }
    case 'lesson': {
      const L = LEZIONI.find(x => x.id === m.id); if (!L || p.inside !== 'maestro') return;
      if (L.classi && !L.classi.some(c => H.classe.startsWith(c))) return toastTo(pid, 'Brann non insegna questa lezione a un ' + H.classe + '.');
      if (p.lessons.some(l => l.id === L.id)) return toastTo(pid, 'Questa lezione l’hai già presa.');
      if (p.corone < L.costo) return toastTo(pid, 'Servono ' + L.costo + ' corone. Ne hai ' + p.corone + '.');
      p.corone -= L.costo; p.lessons.push({id:L.id, stato:'prova'}); logIt(H.name + ' ha iniziato la lezione «' + L.name + '»');
      commit(); toastTo(pid, 'Lezione pagata. Ora supera la prova nel prossimo dungeon.'); return;
    }
    case 'heal': {
      if (p.inside !== 'locanda') return;
      const mx = hpMax(p);
      if (p.hp >= mx) return toastTo(pid, '«Sei in forma. Torna quando ti serve.»');
      if (p.corone < 10) return toastTo(pid, 'Servono 10 corone.');
      p.corone -= 10; p.hp = mx; commit(); toastTo(pid, 'HP al massimo: ' + mx + '.'); return;
    }
    case 'voce': {
      if (p.inside !== 'locanda') return;
      const v = VOCI[S.voce % VOCI.length]; S.voce++;
      let extra = '';
      if (v[1] && !S.unlocked.includes('lettera')) { S.unlocked.push('lettera'); extra = 'Sulla bacheca è comparsa una missione nuova.'; logIt('Sulla bacheca è comparsa una missione nascosta'); }

    }

      const to = S.players[m.to]; const n = Math.max(0, Math.min(p.corone, m.n | 0));
      if (!to || !n) return;
      p.corone -= n; to.corone += n; commit();
      toastTo(pid, 'Hai dato ' + n + ' corone a ' + heroOf(to).name + '.'); toastTo(to.pid, heroOf(p).name + ' ti ha dato ' + n + ' corone.'); return;
    }
  }
}
function closedMsg(place) {

function hostGoto(p, place) {

  if (p.move) return;
  if (S.phase === 'allarme' && place !== 'biblioteca' && !(place === 'locanda' && S.bibEntered)) return toastTo(p.pid, closedMsg(place));
  if (p.inside === place) return;

  p.mseq = (p.mseq || 0) + 1;

}

  const grp = groupKind(place);
  if (grp) {
    const h = heroOf(p);
    inGame().forEach(q => { if (q.pid !== pid && q.inside !== place) NET.sendTo(q.pid, {t:'notify', text:h.name + ' vi aspetta ' + (place === 'biblioteca' ? 'alla Biblioteca' : 'alla Porta Est') + '.', place}); });
  }

}
function groupKind(place) { return place === 'porta' || (place === 'biblioteca' && S.phase === 'allarme'); }

function tabletAction(a) {
  if (a === 'shuffle') { demoRandom(); return; }
  if (a === 'start') { S.phase = 'prologo'; S.step = 0; inGame().forEach(p => { p.node = 'Ps'; p.inside = null; p.move = null; p.hp = hpMax(p); }); commit(); }
  if (a === 'next') { if (S.step < PROLOGO.length - 1) S.step++; else { S.phase = 'allarme'; S.diario = [{id:'biblioteca', by:null, stato:'in corso'}]; } commit(); }
  if (a === 'back') { if (S.step > 0) S.step--; commit(); }
  if (a === 'pnext') { if (S.pstep < PREMIO.length - 1) S.pstep++; commit(); }
  if (a === 'pback') { if (S.pstep > 0) S.pstep--; commit(); }
  if (a === 'enterBib') { S.phase = 'dungeon'; S.bibEntered = true; if (!S.bibRun) S.bibRun = Date.now(); S.bibRoom = null; inGame().forEach(p => { p.node = 'bibD'; p.inside = null; p.move = null; }); commit(); }
  if (a === 'free') { S.phase = 'libera'; commit(); }
  if (a === 'exitGate') { S.gateMsg = true; commit(); }
  if (a === 'backGate') { S.gateMsg = false; inGame().forEach(p => { if (p.inside === 'porta') { p.inside = null; } }); commit(); }
  if (a === 'reset') { const c = S.code; S = freshState(c); Object.keys(TIMERS).forEach(k => clearTimeout(TIMERS[k])); commit(); if (DEMO) demoRandom(); }
}

function interior(p) {
  const pl = p.inside, P = PL[pl], H = heroOf(p);
  let h = `<div class="sheet"><div class="muted cz" style="letter-spacing:.18em;font-size:12px;margin-bottom:12px">${esc(P.name.toUpperCase())}</div>`;
  if (pl === 'bacheca') {
    h += `<div class="say">Fogli inchiodati uno sull’altro. Alcuni sono freschi d’inchiostro.</div><div class="opt">`;
    MISSIONI.filter(mi => mi.id !== 'biblioteca').forEach(mi => {
      const taken = S.diario.some(d => d.id === mi.id);
      if (mi.hidden && !S.unlocked.includes(mi.id)) { h += `<div class="card-opt" style="opacity:.6"><div><div class="t">???</div><div class="d">Nascosta · si sblocca parlando con qualcuno</div></div></div>`; return; }
      h += `<button class="card-opt" data-do="accept" data-v="${mi.id}" ${taken ? 'disabled' : ''}><div><div class="t">${esc(mi.name)}</div><div class="d">${mi.tipo} · ${'★'.repeat(mi.stelle)} · ${esc(mi.dove)}</div><div class="d" style="margin-top:6px">${esc(mi.txt)}</div></div><div class="price" style="font-size:13px;text-align:right">${taken ? 'nel Diario' : esc(mi.premio)}</div></button>`;
    });
    h += `</div>`;
  } else {
    const Dg = DIAL[pl];
    const said = UI.say[pl] || (pl === 'locanda' && UI.voce ? UI.voce.text : null) || (S.phase === 'allarme' && Dg.allarme) || Dg.intro;
    h += npcHead(P) + `<div class="say"><p>${esc(said)}</p>${pl === 'locanda' && UI.voce && UI.voce.extra && !UI.say[pl] ? `<p class="gold" style="font-weight:600">${esc(UI.voce.extra)}</p>` : ''}</div>`;
    if (S.phase !== 'allarme' || pl !== 'orlo') h += `<div class="topics">${Dg.topics.map((t, i) => `<button class="${UI.seen[pl + i] ? 'seen' : ''}" data-do="topic" data-v="${i}">${esc(t[0])}</button>`).join('')}${pl === 'locanda' ? `<button data-do="voce">Cosa si dice in giro?</button>` : ''}</div>`;
    if (pl === 'locanda') h += `<div class="opt"><button class="card-opt" data-do="heal"><div><div class="t">Un letto e una zuppa</div><div class="d">Cura completa · HP ${p.hp}/${hpMax(p)} → ${hpMax(p)}</div></div><div class="price">10</div></button></div>`;
    if (pl === 'bustine') {
      if (UI.bought) h += `<div class="say"><div class="cz gold" style="font-size:18px;margin-bottom:6px">Bustina pagata</div>Prendi una bustina vera dalla scatola e aprila. Poi carica le carte nella tua Collezione.</div><div class="opt"><button class="btn" data-do="gocoll">Vai alla Collezione</button></div>`;
      else h += `<div class="opt"><button class="card-opt" data-do="buy" ${p.corone < 80 ? 'disabled' : ''}><div><div class="t">Una bustina</div><div class="d">Tutte uguali · hai ${p.corone} corone</div></div><div class="price">80</div></button></div>`;
    }
    if (pl === 'maestro') {
      h += `<div class="opt">`;
      LEZIONI.forEach(L => {
        const ok = !L.classi || L.classi.some(c => H.classe.startsWith(c)); const has = p.lessons.find(l => l.id === L.id);
        h += `<button class="card-opt" data-do="lesson" data-v="${L.id}" ${(!ok || has || p.corone < L.costo) ? 'disabled' : ''}><div><div class="t">${esc(L.name)}</div><div class="d">${esc(L.eff)}</div><div class="d" style="margin-top:4px">${L.classi ? 'Solo Guerrieri, Paladini, Barbari, Monaci' : 'Per tutti'} · Prova: ${esc(L.prova)}</div></div><div class="price">${has ? (has.stato === 'prova' ? 'in prova' : 'presa') : L.costo}</div></button>`;
      });
      h += `</div>`;
    }
  }
  h += `<button class="btn ghost" data-do="leave" style="margin-top:auto">Esci</button></div>`;
  return h;
}
function waitingRoom(p) {
  const pl = p.inside, w = waitingAt(pl), tot = inGame().length;
  const nm = pl === 'biblioteca' ? 'La porta della Biblioteca' : 'Porta Est';
  return `<div class="sheet" style="align-items:center;justify-content:center;text-align:center;gap:16px"><div class="muted cz" style="letter-spacing:.18em;font-size:12px">${nm.toUpperCase()}</div><div class="cz" style="font-size:64px;color:var(--gold)">${w.length}/${tot}</div><div style="font-size:17px">${w.length === tot ? 'Ci siete tutti. Guardate il tavolo.' : 'Aspettate gli altri giocatori.'}</div><div style="display:flex;flex-wrap:wrap;gap:8px;justify-content:center">${inGame().map(q => `<span class="pill" style="${w.includes(q) ? '' : 'opacity:.4'}"><span class="dot" style="background:${q.color}"></span>${esc(heroOf(q).name)}</span>`).join('')}</div><button class="btn ghost" data-do="leave" style="margin-top:20px">Esci dalla fila</button></div>`;
}
function renderPhone() {
  const head = $('#phead'), full = $('#pfull'), sheet = $('#psheet');
  if (!S) { head.innerHTML = `<div class="nm">Gods’ Tournament</div>`; full.innerHTML = `<div class="full" style="background:var(--bg);z-index:20"><h2 style="font-size:24px">Crocevia</h2><p class="muted">${esc(UI.status)}</p><p class="muted" style="font-size:13px">Codice tavolo ${esc(ROOM)}</p></div>`; return; }
  const p = me(); if (!p) return;
  const H = heroOf(p);
  head.innerHTML = H ? `<span class="dot" style="background:${p.color};width:16px;height:16px"></span><div style="flex:1;min-width:0"><div class="nm">${esc(H.name)}</div><div class="sub">${esc(H.ep)}</div></div><span class="pill">HP ${p.hp}/${hpMax(p)}</span><span class="pill gold">${p.corone} corone</span>`
    : `<span class="dot" style="background:${p.color};width:16px;height:16px"></span><div style="flex:1"><div class="nm">Nuovo giocatore</div><div class="sub">Carica le tue carte</div></div>`;
  $('#ph').className = 'st-' + S.phase + (S.bibEntered ? ' bibin' : '');
  // schermate a tutto schermo
  let f = '';
  if (!H) { UI.tab = 'coll'; }
  if (S.phase === 'lobby' && H) f = '';
  if (S.phase === 'prologo' || S.phase === 'premio') { const st = S.phase === 'prologo' ? PROLOGO[S.step] : PREMIO[S.pstep || 0]; f = `<div class="full" style="background:var(--bg);z-index:20;justify-content:flex-start;text-align:left;overflow:auto"><div class="cz gold" style="letter-spacing:.2em;font-size:12px;margin-top:20px">${st.kick}</div>${st.ps.map(t => `<p>${esc(t)}</p>`).join('')}<p class="muted" style="font-size:14px;margin-top:10px">Si legge al tavolo.</p></div>`; }
  const wantBib = S.phase === 'dungeon' && !IFR && S.bibRoom && H;
  if (wantBib) {
    const src = 'biblioteca.html?stanza=' + S.bibRoom;
    if (!$('#pbib') || $('#pbib').dataset.src !== src) {
      lsSet('gt-phone-kit', JSON.stringify({hero:p.hero, weapon:p.equip.arma || '', armor:p.equip.armatura || '', acc:p.equip.accessorio || ''}));
      lsSet('gt-phone-room', S.bibRoom); lsSet('gt-phone-auto', '1');
      if ($('#pbib')) $('#pbib').remove();
      const d = document.createElement('div'); d.id = 'pbib'; d.dataset.src = src; d.innerHTML = `<iframe src="${src}" title="La Biblioteca"></iframe>`; document.body.appendChild(d);
    }
  } else if ($('#pbib')) $('#pbib').remove();
  if (S.phase === 'dungeon' && !wantBib) f = `<div class="full" style="background:var(--bg);z-index:20"><div class="cz gold" style="letter-spacing:.2em;font-size:12px">DUNGEON</div><h2 style="font-size:28px">La Biblioteca</h2><p class="muted">${IFR ? 'In questa prova il dungeon si gioca sul tavolo, con i dadi sullo schermo.' : 'Il tavolo sta aprendo la Biblioteca…'}</p></div>`;
  if (S.phase === 'lobby' && H) f = '';
  full.innerHTML = f;
  // schede
  $('#pcitta').style.display = UI.tab === 'citta' ? '' : 'none';
  $('#pcoll').style.display = UI.tab === 'coll' ? '' : 'none';
  $('#pdiario').style.display = UI.tab === 'diario' ? '' : 'none';
  document.querySelectorAll('#pnav button').forEach(b => b.classList.toggle('on', b.dataset.t === UI.tab));
  if (UI.tab === 'coll') { const keep = $('#codein') && $('#codein').value; $('#pcoll').innerHTML = renderColl(p); if (keep) $('#codein').value = keep; }
  if (UI.tab === 'diario') $('#pdiario').innerHTML = renderDiario(p);
  if (UI.tab === 'citta' && S.phase === 'lobby') $('#pbanner').innerHTML = `<div class="banner glass"><div class="t">${H ? 'Il tavolo sta per iniziare. Intanto puoi caricare altre carte.' : 'Prima carica il tuo personaggio nella Collezione.'}</div></div>`;
  else if (UI.banner && UI.tab === 'citta' && !p.inside) $('#pbanner').innerHTML = `<div class="banner glass"><div class="t">${esc(UI.banner.text)}</div><button class="btn small" data-do="gonotify">Vai</button><button class="btn ghost small" data-do="closebanner">×</button></div>`;
  else $('#pbanner').innerHTML = '';
  // dentro un luogo
  let sh = '';
  if (UI.detail && UI.tab === 'coll') sh = cardDetail(p, UI.detail);
  else if (p.inside && !p.move && UI.tab === 'citta') sh = groupKind2(p.inside) ? waitingRoom(p) : interior(p);
  sheet.innerHTML = sh;
  if (!vbInit) centerOnMe(true);
}
function groupKind2(place) { return place === 'porta' || (place === 'biblioteca' && S.phase === 'allarme'); }

/* ============ AVVIO ============ */
document.addEventListener('gesturestart', e => e.preventDefault());
if (PHONE) startPhone(); else startTablet();
</script>
</body>
</html>
